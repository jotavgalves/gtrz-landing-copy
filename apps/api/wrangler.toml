name = "gtrz-api"
main = "src/index.ts"
compatibility_date = "2026-09-14"
workers_dev = false

[observability]
enabled = true

[vars]
APP_ENV = "production"
CORS_ALLOWED_ORIGINS = "https://gtrz.com.br,https://www.gtrz.com.br,https://control.gtrz.com.br"

[[routes]]
pattern = "api.gtrz.com.br"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "gtrz-prod"
database_id = "8b8bbabe-429a-4e85-b4a0-95a263892d25"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gtrz-media-prod"
